<style>
:root{--bg:#2b2730;--purple:#9b78b4;--purple-d:#6f5489;--red:#e0564f;--red-d:#b53a35}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;background:radial-gradient(ellipse at 50% 45%,#3b3443 0%,#25212a 60%,#1b181f 100%) fixed var(--bg);overflow:hidden;touch-action:manipulation;overscroll-behavior:none}
#view{position:fixed;left:0;top:0;width:100%;height:100%;overflow:hidden}
#stage{position:absolute;left:0;top:0;width:2123px;height:1302px;transform-origin:0 0;border-radius:36px;overflow:hidden;box-shadow:0 30px 60px rgba(0,0,0,.55)}
#device{position:absolute;left:0;top:0;width:2123px;height:1302px;display:block;pointer-events:none}
#cv{position:fixed;display:block;image-rendering:auto;z-index:2}
#stage #cv{position:absolute;left:564px;top:322px;width:997px;height:632px}
.hit{position:absolute;z-index:3;border:0;padding:0;background:transparent;cursor:pointer;border-radius:50%}
.hit.pill{border-radius:30px}
.hit.on{background:rgba(0,0,0,.22)}
/* built-in controls on the landscape device (stage coordinates) */
#devctl{position:absolute;left:470px;top:1131px;width:1180px;height:76px;display:flex;justify-content:space-evenly;align-items:center;z-index:3}
.dc{display:flex;align-items:center;gap:14px}
.dpill{width:96px;height:61px;border:0;padding:0;cursor:pointer;touch-action:none;background:url(assets/pill.png) center/contain no-repeat;transition:transform .06s}
.dpill.on{transform:translateY(2px);filter:brightness(.88)}
.dc span{font:700 25px/1 "Helvetica Neue",Helvetica,Arial,sans-serif;letter-spacing:1.5px;color:#2a2622;text-shadow:0 1px 0 rgba(255,255,255,.35)}
.dled{position:relative;width:30px;height:30px;border-radius:50%;background:url(assets/led.png) center/contain no-repeat}
.dled::after{content:"";position:absolute;inset:7px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#fff3d0,#ff9a3c 45%,#e2541b 80%);opacity:0;transition:opacity .15s}
.dled.lit::after{opacity:.95;box-shadow:0 0 14px 5px rgba(255,130,40,.55)}

/* ===== portrait: the device stood upright ===== */
#shell{display:none;position:fixed;inset:0;z-index:4;
  padding:calc(env(safe-area-inset-top) + 8px) calc(env(safe-area-inset-right) + 8px) calc(env(safe-area-inset-bottom) + 8px) calc(env(safe-area-inset-left) + 8px);
  background:linear-gradient(160deg,#ad8dc6 0%,#9474b0 45%,#7f5f9c 100%)}
#face{height:100%;display:flex;flex-direction:column;border-radius:26px;padding:10px 14px 14px;
  background:
    repeating-linear-gradient(90deg,rgba(255,255,255,.035) 0 1px,transparent 1px 3px),
    linear-gradient(170deg,#f2e6b6 0%,#e0cc8b 48%,#cdb571 100%);
  box-shadow:inset 0 2px 0 rgba(255,255,255,.7),inset 0 -3px 8px rgba(80,60,20,.25),0 0 0 2px #c3ab6a,0 3px 10px rgba(40,20,60,.35)}
#top{display:flex;align-items:center;justify-content:space-between;min-height:46px;margin-bottom:8px}
#best{font:800 12px/1.25 "Helvetica Neue",Arial,sans-serif;letter-spacing:1.2px;color:#5a4a28;text-shadow:0 1px 0 rgba(255,255,255,.6)}
#best b{display:block;font-size:10px;letter-spacing:2px;color:#8a7440}
/* built-in controls on the upright device: small pills like GAME A/B/TIME */
#upctl{display:flex;gap:clamp(6px,2.4vw,12px)}
.uc{display:flex;flex-direction:column;align-items:center;gap:4px}
.pillbtn.sm{width:clamp(38px,11vw,50px);height:21px;border-width:3px;border-radius:11px;box-shadow:0 2px 0 #6f5489,0 3px 5px rgba(60,40,10,.22),inset 0 1px 0 #fff}
.pillbtn.sm.on{transform:translateY(2px);box-shadow:0 0 0 #6f5489,inset 0 2px 3px rgba(0,0,0,.2)}
.uc i{font:800 8.5px/1 "Helvetica Neue",Arial,sans-serif;font-style:normal;letter-spacing:.6px;color:#3d3220;display:flex;align-items:center;gap:3px;text-shadow:0 1px 0 rgba(255,255,255,.55)}
.uled{width:7px;height:7px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#d9d4c4,#8c8676);box-shadow:inset 0 0 0 1px #6f6a5c}
.uled.lit{background:radial-gradient(circle at 40% 35%,#fff3d0,#ff9a3c 50%,#e2541b);box-shadow:0 0 5px 1px rgba(255,130,40,.7)}

#bezel{position:relative;border-radius:12px;padding:24px 10px 24px;
  background:linear-gradient(180deg,#f1f1f4 0%,#d3d3d9 40%,#bcbcc4 100%);
  box-shadow:inset 0 0 0 2px #fafafc,inset 0 0 0 3px #a3a3ac,0 3px 0 #9a8650,0 6px 14px rgba(60,40,10,.25)}
#bezel .lbl{position:absolute;left:12px;right:12px;height:2px;background:#2a2a2a;display:flex;justify-content:center;align-items:center}
#bezel .lbl span{background:#e2e2e6;padding:0 9px;font:900 11px/1 "Arial Black",Arial,sans-serif;letter-spacing:1.6px;color:#222}
#bezel .lbl.t{top:12px}#bezel .lbl.b{bottom:12px}
#bezel .lbl.b span{background:#c4c4cb;font:700 10px/1 Arial,sans-serif;letter-spacing:1.2px}
#lcdframe{background:linear-gradient(#a184bb,#8f6fab);border-radius:8px;padding:7px;box-shadow:inset 0 0 0 2px #7a5a96,inset 0 2px 3px rgba(0,0,0,.25)}
#lcdSlot canvas{position:static!important;display:block;width:100%!important;height:auto!important;aspect-ratio:997/632;border:2px solid #1d1b19;border-radius:2px;box-shadow:inset 0 0 8px rgba(0,0,0,.4)}

#pad{flex:1;display:flex;flex-direction:column;justify-content:space-evenly;padding-top:6px}
.pills{display:flex;justify-content:center;gap:clamp(18px,6vw,34px)}
.pw,.bw{display:flex;flex-direction:column;align-items:center;gap:6px}
.pw i,.bw i{font:800 11px/1 "Helvetica Neue",Arial,sans-serif;font-style:normal;letter-spacing:1px;color:#3d3220;text-shadow:0 1px 0 rgba(255,255,255,.55)}
.pillbtn{width:62px;height:28px;border-radius:14px;padding:0;cursor:pointer;touch-action:none;
  border:4px solid #9b78b4;background:linear-gradient(#fbfbfd,#c7c7cf 60%,#a9a9b3);
  box-shadow:0 3px 0 #6f5489,0 5px 8px rgba(60,40,10,.25),inset 0 1px 0 #fff}
.pillbtn.on{transform:translateY(3px);box-shadow:0 0 0 #6f5489,0 1px 2px rgba(60,40,10,.2),inset 0 2px 3px rgba(0,0,0,.2)}
.main{display:flex;flex-direction:row-reverse;align-items:center;justify-content:space-between;padding:0 clamp(6px,4vw,22px)}
.dpad{display:flex;flex-direction:column;gap:clamp(6px,1.6vh,14px)}
.red{--s:clamp(66px,10.5vh,86px);width:var(--s);height:var(--s);border-radius:50%;padding:0;cursor:pointer;touch-action:none;
  border:6px solid #9b78b4;
  background:radial-gradient(circle at 34% 28%,#ffb3aa 0%,#f0645a 22%,#d63a31 55%,#9e1f19 100%);
  box-shadow:0 0 0 2px #7b5a98,0 5px 0 #6a4e85,0 9px 14px rgba(60,30,10,.35),inset 0 -5px 8px rgba(80,0,0,.35),inset 0 3px 5px rgba(255,255,255,.35)}
.red.big{--s:clamp(92px,15vh,124px)}
#shell.scaled{padding:0;background:radial-gradient(ellipse at 50% 45%,#3b3443 0%,#25212a 60%,#1b181f 100%)}
#shell.scaled #face{border:12px solid #9474b0;border-radius:38px;box-shadow:inset 0 2px 0 rgba(255,255,255,.7),inset 0 -3px 8px rgba(80,60,20,.25),0 0 0 2px #7f5f9c,0 24px 50px rgba(0,0,0,.55)}
#shell.scaled .red{--s:82px}#shell.scaled .red.big{--s:116px}#shell.scaled .dpad{gap:12px}
#shell.scaled .pills{gap:26px}#shell.scaled .main{padding:0 18px}
#shell.scaled .pillbtn.sm{width:48px}
.red.on{transform:translateY(4px);box-shadow:0 0 0 2px #7b5a98,0 1px 0 #6a4e85,0 2px 4px rgba(60,30,10,.3),inset 0 -2px 6px rgba(80,0,0,.4),inset 0 3px 7px rgba(0,0,0,.25)}
</style>

<body>

  <button class="hit pill" id="bA"  aria-label="GAME A"  style="left:1780px;top:142px;width:140px;height:60px"></button>

<div id="shell"><div id="face">
  <div id="top"><div id="best"></div><div id="upctl">

    <div class="uc"><button class="pillbtn sm" id="pause" aria-label="pause"></button><i><b class="uled" data-led="pause"></b>PAUSE</i></div>

</div></div>

<script>
(()=>{
"use strict";
const ATLAS={"ch_ball":{"x":0,"y":370,"w":290,"h":262},"ch_toss":{"x":0,"y":370,"w":290,"h":262},"ch_idle":{"x":0,"y":370,"w":290,"h":262},"ch_pow":{"x":0,"y":370,"w":290,"h":262},"lu_up":{"x":0,"y":95,"w":230,"h":250},"lu_idle":{"x":0,"y":95,"w":230,"h":250},"lu_swing":{"x":0,"y":95,"w":230,"h":250},"sn_top_idle":{"x":560,"y":95,"w":437,"h":505},"sn_mid_idle":{"x":560,"y":95,"w":437,"h":505},"sn_bot_idle":{"x":560,"y":95,"w":437,"h":505},"sn_top_up":{"x":560,"y":95,"w":437,"h":505},"sn_top_swing":{"x":560,"y":95,"w":437,"h":505},"sn_bot_swing":{"x":560,"y":95,"w":437,"h":505},"sn_bot_up":{"x":560,"y":95,"w":437,"h":505},"sn_mid_up":{"x":560,"y":95,"w":437,"h":505},"sn_mid_swing":{"x":560,"y":95,"w":437,"h":505},"miss_txt":{"x":464,"y":4,"w":100,"h":40},"bird1":{"x":480,"y":46,"w":82,"h":71},"bird2":{"x":557,"y":46,"w":81,"h":71},"letterA":{"x":128,"y":590,"w":38,"h":38},"digits":{"ones":{"x":310,"y":0,"w":62,"h":100},"pitch":62,"h1":{"x":178,"y":0,"w":56,"h":100}},"pos":[[196.8,294.6],[198.2,133.6],[207.5,204.7],[273.6,345.0],[296.7,314.4],[296.9,375.1],[297.6,264.0],[301.0,213.4],[308.9,128.2],[344.0,311.6],[354.0,221.5],[377.3,375.0],[404.4,344.1],[405.4,129.8],[406.0,291.0],[410.5,233.4],[411.9,186.2],[460.2,382.1],[472.9,278.3],[474.7,162.5],[507.8,136.6],[508.3,378.8],[508.4,253.9],[544.9,405.1],[551.9,147.7],[611.8,276.6],[613.3,430.5],[618.7,147.8],[246,320],[544,275]],"sn_sleep":{"x":560,"y":95,"w":437,"h":505},"ch_away":{"x":0,"y":370,"w":290,"h":262},"cm_idle":{"x":296,"y":372,"w":354,"h":260},"cm_throw":{"x":296,"y":372,"w":354,"h":260},"crash":{"x":787,"y":117,"w":217,"h":229},"am":{"x":23,"y":7,"w":56,"h":33},"game_a":{"x":23,"y":593,"w":137,"h":31},"game_b":{"x":838,"y":588,"w":137,"h":37},"wood_l":{"x":792,"y":19,"w":74,"h":65},"wood_r":{"x":878,"y":22,"w":80,"h":62},"lu_low_rk":{"x":130,"y":264,"w":36,"h":67},"toss_fx":{"x":175,"y":336,"w":81,"h":66},"miss_ball0":{"x":776,"y":153,"w":78,"h":41},"miss_ball1":{"x":774,"y":296,"w":86,"h":60},"miss_ball2":{"x":798,"y":500,"w":58,"h":83},"lu_low_arm":{"x":102,"y":232,"w":52,"h":31},"pow_txt":{"x":15,"y":345,"w":89,"h":140},"pause_txt":{"x":393,"y":285,"w":211,"h":62}};
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const W=997,H=632;
ATLAS.bg={x:0,y:0,w:997,h:632};
const POS=ATLAS.pos;                           // the fixed ball positions of the LCD (from the all-segments photo)
// ball lanes (indexes into POS). Charlie's balls fly slowly, Lucy's twice as fast.
// Charlie's lanes: a rising lob to the top branch, a level drive to the middle, a low drive to the ground
const CHARLIE=[[28,6,10,16,19,24,27],[3,9,14,18,29,25],[5,11,17,23,26]];   // top, middle, bottom
const LUCY   =[[1,8,13,20,27],[2,7,15,22,25],[0,4,12,21,26]];   // Lucy's straight, faster shots
const MISSPOS=[[832,180],[842,334],[834,565]];                   // a missed ball flies on into the tree
const SPOT=['top','mid','bot'];
const MAX_MISS=3;

/* ---------- assets ---------- */
const NAMES=['pause_txt','pow_txt','lu_low_arm','am','game_a','game_b','wood_l','wood_r','lu_low_rk','toss_fx','miss_ball0','miss_ball1','miss_ball2','bg','ch_ball','ch_toss','ch_idle','ch_pow','lu_up','lu_idle','lu_swing','miss_txt','bird1','bird2',
  'sn_sleep','ch_away','cm_idle','cm_throw','crash',
  'sn_top_idle','sn_top_up','sn_top_swing','sn_mid_idle','sn_mid_up','sn_mid_swing','sn_bot_idle','sn_bot_up','sn_bot_swing'];
const EXT={pause_txt:'png',pow_txt:'png',lu_low_arm:'png',am:'png',game_a:'png',game_b:'png',wood_l:'png',wood_r:'png',lu_low_rk:'png',toss_fx:'png',miss_ball0:'png',miss_ball1:'png',miss_ball2:'png'};
const IMG={};
let loaded=0,total=NAMES.length+11;
function load(key,src){const im=new Image();im.onload=()=>{loaded++};im.onerror=()=>{loaded++};im.src=src;IMG[key]=im}
NAMES.forEach(n=>load(n,`assets/${n}.${EXT[n]||'webp'}`));
for(let i=0;i<10;i++)load('d'+i,`assets/d${i}.png`);
load('h1','assets/h1.png');
const ready=()=>loaded>=total;

/* ---------- state ---------- */
let mode='clock';                 // clock | play | over
let game='A';
let score=0,miss=0,spot=0;
let best={A:0,B:0};try{best=JSON.parse(localStorage.getItem('snoopy-best')||'{"A":0,"B":0}')}catch(e){}
let balls=[],serve=null,nextServe=0,pauseUntil=0,swingAt=-1e9,lucyHitAt=-1e9,lucyHitLane=0,chHitAt=-1e9,rallies={C:0,L:0},overAt=0,newBest=false,chIdleUntil=0;
let hitBuffer=0;
let wood={l:false,r:false,next:0};   // Woodstocks in the nest, at random
let missSeq=null,deadPose=false;   // miss animation (timings measured from the original)
const MS={crash:530,count:930,sleep:2100,walk:2900,throw:4100,end:5300};
let paused=false,pausedAt=0,pausedTotal=0;
const gnow=()=>(paused?pausedAt:performance.now())-pausedTotal;
let muted=false;try{muted=localStorage.getItem('snoopy-mute')==='1'}catch(e){}

/* ---------- audio ---------- */
let ac=null;
function beep(f,d,type='square',v=.05,delay=0){
  if(muted)return;
  try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();
    const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime+delay;
    o.type=type;o.frequency.value=f;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+d+.02);}catch(e){}
}
const sTick=()=>beep(300,.03,'square',.02);
const sHit=()=>{beep(1300,.07);beep(1700,.09,'square',.05,.07)};
const sMiss=()=>{beep(150,.35,'sawtooth',.07);beep(110,.35,'sawtooth',.07,.18)};
const sStart=()=>{[660,880,1320].forEach((f,i)=>beep(f,.08,'square',.05,i*.09))};
const sOver=()=>{[500,420,340,260].forEach((f,i)=>beep(f,.18,'square',.06,i*.2))};
const sFan=()=>[784,988,1175,1568,1175,1568].forEach((f,i)=>beep(f,.11,'square',.05,i*.11));

/* ---------- timing (measured from the recordings) ---------- */
// Charlie's ball: ~1.5 s per position, a bit quicker as the score rises. Lucy's ball is twice as fast.
// Difficulty stays as it starts until 50 points, then keeps rising: about 10% faster every 40 points, one more ball in play
// every 150 points (never more than 4), and serves come closer together at the same rate.
function cfg(){
  const A=game==='A',over=Math.max(0,score-50),f=Math.pow(0.9,over/40);   // flat until 50 points
  return {c:A?1550:1200,min:A?380:300,f,max:Math.min(4,(A?2:3)+Math.floor(over/150)),gap:Math.max(A?1100:850,(A?3200:2300)*f)};
}
const stepC=()=>{const c=cfg();return Math.max(c.min,c.c*c.f)};
const stepL=()=>stepC()*0.55;

/* ---------- game ---------- */
function start(g){
  setPause(false);
  chHitAt=-1e9;lucyHitAt=-1e9;lucyHitLane=0;game=g;mode='play';score=0;miss=0;spot=0;balls=[];serve=null;newBest=false;missSeq=null;deadPose=false;
  pauseUntil=gnow()+900;nextServe=pauseUntil+400;sStart();
}
function toClock(){setPause(false);mode='clock';balls=[];serve=null;missSeq=null;deadPose=false}
function setPause(on){
  if(on===paused)return;
  if(on){if(mode!=='play')return;paused=true;pausedAt=performance.now()}
  else{pausedTotal+=performance.now()-pausedAt;paused=false}
  syncLeds();
}
const togglePause=()=>setPause(!paused);
const rnd=n=>Math.floor(Math.random()*n);

function beginServe(now){
  serve={t0:now,lane:rnd(3),launched:false};
  nextServe=now+cfg().gap;
}
function launchCharlie(now,lane){
  balls.push({type:'C',lane,path:CHARLIE[lane],i:0,ret:false,next:now+stepC()});
}
// Missed: the ball vanishes, CRASH! in the tree, a bird is added, Snoopy naps on his doghouse,
// Charlie walks out and throws his racket, then play resumes.
function doMiss(now,lane){
  balls=[];serve=null;hitBuffer=0;missSeq={t0:now,counted:false,lane};
  pauseUntil=now+MS.end;nextServe=pauseUntil+700;
  beep(160,.3,'sawtooth',.07,MS.crash/1000);beep(110,.35,'sawtooth',.07,MS.crash/1000+.16);
}
function stepMiss(now){
  const e=now-missSeq.t0;
  if(!missSeq.counted&&e>=MS.count){missSeq.counted=true;miss++;beep(700,.06,'square',.04)}
  if(!missSeq.zz&&e>=MS.sleep){missSeq.zz=true;[392,330,262].forEach((f,i)=>beep(f,.16,'triangle',.05,i*.18))}
  if(!missSeq.thr&&e>=MS.throw){missSeq.thr=true;beep(220,.08,'square',.05);beep(180,.12,'square',.05,.09)}
  if(e>=MS.end){missSeq=null;if(miss>=MAX_MISS){deadPose=true;gameOver()}}
}
function showBest(){const el=document.getElementById('best');if(el)el.innerHTML='<b>BEST</b>A '+(best.A||0)+' &nbsp;·&nbsp; B '+(best.B||0)}
function gameOver(){
  mode='over';overAt=gnow();sOver();
  if(score>(best[game]||0)){best[game]=score;newBest=true;try{localStorage.setItem('snoopy-best',JSON.stringify(best))}catch(e){}}
  showBest();
}
function addScore(n){
  const before=score;score=Math.min(999,score+n);
  for(const m of [200,500])if(before<m&&score>=m){miss=0;sFan()}
}
function doHit(){
  if(paused){setPause(false);return}
  const now=gnow();
  if(mode!=='play'){start(game);return}
  if(now<pauseUntil)return;
  swingAt=now;
  if(!tryHit(now)){hitBuffer=now+300;beep(500,.04,'triangle',.04)}
}
// A ball can be hit while it is in front of Snoopy (last position) or one step before it.
function tryHit(now){
  const b=balls.filter(b=>!b.ret&&b.lane===spot&&b.i>=b.path.length-2).sort((a,c)=>c.i-a.i)[0];
  if(!b)return false;
  hitBuffer=0;swingAt=Math.min(swingAt,now);
  addScore(b.type==='C'?2:3);sHit();
  // the return flies straight back at the same height (leaves at once): to Charlie, who rallies it,
  // or into Lucy's lane, where she intercepts it
  b.ret=true;b.to=Math.random()<0.5?'L':'C';   // half to Lucy, half back to Charlie
  b.path=(b.to==='L'?LUCY:CHARLIE)[b.lane].slice().reverse();b.i=1;b.next=now+stepL();
  return true;
}
function move(d){
  if(mode!=='play'||paused||missSeq)return;
  const n=Math.max(0,Math.min(2,spot+d));
  if(n!==spot){spot=n;hitBuffer=0;beep(420,.025,'square',.03)}
}

function update(now){
  if(mode!=='play'||paused)return;
  if(missSeq){stepMiss(now);return}
  if(now<pauseUntil)return;
  // Charlie's serve animation: toss -> POW (ball leaves) -> rest
  if(serve){
    const a=now-serve.t0;
    if(!serve.launched&&a>=700){serve.launched=true;launchCharlie(now,serve.lane);beep(900,.05,'square',.05);chIdleUntil=now+1100}
    if(a>=1300)serve=null;
  }else if(balls.length<cfg().max&&now>=nextServe)beginServe(now);

  for(const b of balls.slice()){
    if(now<b.next)continue;
    if(!b.ret){
      if(b.i<b.path.length-1){b.i++;b.next=now+(b.type==='C'?stepC():stepL());sTick();
        if(now<hitBuffer&&b.lane===spot&&b.i>=b.path.length-2){swingAt=now;tryHit(now)}}
      else{doMiss(now,b.lane);return}                       // ball sat at Snoopy's spot and nobody hit it
    }else{
      if(b.i<b.path.length-1){b.i++;b.next=now+stepL();sTick()}
      else if(b.to==='L'){                            // reached Lucy: she hits it back, faster
        lucyHitAt=now;lucyHitLane=b.lane;rallies.L++;beep(1000,.05,'square',.05);
        const lane=rnd(3);b.type='L';b.lane=lane;b.path=LUCY[lane];b.i=0;b.ret=false;b.next=now+stepL();
      }else{                                          // reached Charlie: he rallies it back
        chHitAt=now;rallies.C++;beep(900,.05,'square',.05);
        const lane=rnd(3);b.type='C';b.lane=lane;b.path=CHARLIE[lane];b.i=0;b.ret=false;b.next=now+stepC();
      }
    }
  }
}

function stepWood(now){
  if(now<wood.next)return;
  if(wood.l||wood.r){wood.l=wood.r=false;wood.next=now+3000+Math.random()*7000}
  else{const k=Math.random();wood.l=k<.7;wood.r=k>.35;wood.next=now+1500+Math.random()*2500}
}

/* ---------- drawing ---------- */
function spr(n){const a=ATLAS[n],im=IMG[n];if(im&&im.complete)ctx.drawImage(im,a.x,a.y,a.w,a.h)}
function digits(val,showZeroAlone=true,x0=0){
  const d=ATLAS.digits,s=String(val);
  for(let i=0;i<s.length;i++){
    const place=s.length-1-i,ch=s[i],im=IMG[(place===2&&ch==='1')?'h1':'d'+ch];
    if(!im||!im.complete)continue;
    if(place===2&&ch==='1')ctx.drawImage(im,d.h1.x,d.h1.y,d.h1.w,d.h1.h);
    else ctx.drawImage(im,d.ones.x-d.pitch*place+x0,d.ones.y,d.ones.w,d.ones.h);
  }
}
function drawBall(i){
  const [x,y]=POS[i];
  ctx.fillStyle='#161a16';ctx.beginPath();ctx.ellipse(x,y,19.5,12,0,0,Math.PI*2);ctx.fill();
}
function render(now){
  if(!ready()){ctx.fillStyle='#8f988f';ctx.fillRect(0,0,W,H);return}
  spr('bg');
  const playing=mode==='play';
  if(!paused)stepWood(now);
  if(wood.l)spr('wood_l');if(wood.r)spr('wood_r');

  // Lucy (appears when she is about to hit / hitting)
  const lucyHitting=now-lucyHitAt<420;
  const me=missSeq?now-missSeq.t0:(deadPose?1e9:-1);   // time into the miss animation
  // Lucy waits with her racket down, raises it as the ball arrives, then swings
  // Each of Lucy's three racket segments sits at one of her three ball positions:
  // raised = top, outstretched = middle, held low = bottom. She shows the one for the
  // ball that is coming to her (and keeps it for a moment after hitting).
  const LUCY_POSE=[()=>spr('lu_up'),()=>spr('lu_swing'),()=>{spr('lu_idle');spr('lu_low_arm');spr('lu_low_rk')}];
  const toLucy=balls.filter(b=>b.ret&&b.to==='L'&&b.i>=b.path.length-3).sort((a,c)=>c.i-a.i)[0];
  if(me<0){if(lucyHitting)LUCY_POSE[lucyHitLane]();else if(toLucy)LUCY_POSE[toLucy.lane]()}

  // Charlie
  if(me>=MS.walk)spr('ch_away');   // Charlie in the middle is drawn after Snoopy (his racket reaches into that area)
  else{
    let ch='ch_ball';
    const chNear=balls.some(b=>b.ret&&b.to==='C'&&b.i>=b.path.length-2);
    if(now-chHitAt<420)ch='ch_pow';                       // rallying a return
    else if(serve){const a=now-serve.t0;ch=a<350?'ch_ball':a<700?'ch_toss':'ch_pow'}
    else if(chNear||now<chIdleUntil)ch='ch_idle';         // racket ready for an incoming return
    spr(ch);
    if(ch==='ch_pow')spr('pow_txt');                      // full POW! lettering
    if(ch==='ch_toss')spr('toss_fx');                     // the ball tossed above his head
  }
  // GAME A label at the left, GAME B at the right (none in clock mode), as on the LCD
  if(mode!=='clock')spr(game==='A'?'game_a':'game_b');

  // Snoopy
  if(me>=MS.sleep)spr('sn_sleep');
  else{
    const age=now-swingAt;
    // racket stays down until HIT is pressed: raise, then swing
    const pose=me>=0?'idle':age<120?'up':age<420?'swing':'idle';
    spr(`sn_${SPOT[spot]}_${pose}`);
  }
  if(missSeq&&me<450){const L=missSeq.lane;spr('miss_ball'+L);const [x,y]=MISSPOS[L];
    ctx.fillStyle='#161a16';ctx.beginPath();ctx.ellipse(x,y,19.5,12,0,0,Math.PI*2);ctx.fill()}
  if(me>=MS.crash&&me<MS.walk)spr('crash');
  if(me>=MS.walk)spr(me>=MS.throw?'cm_throw':'cm_idle');

  // misses
  if(miss>0){
    spr('miss_txt');
    for(let i=0;i<Math.min(miss,MAX_MISS);i++){
      const a=ATLAS[i===0?'bird1':'bird2'],im=IMG[i===0?'bird1':'bird2'];
      const x=i===2?ATLAS.bird1.x-75:a.x;                // the third bird sits to the left of the others
      if(im&&im.complete)ctx.drawImage(im,x,a.y,a.w,a.h);
    }
  }

  // balls
  if(playing||mode==='over')for(const b of balls)drawBall(b.path[b.i]);

  // score / clock
  if(mode==='clock'){
    const d=new Date();let h=d.getHours()%12;if(h===0)h=12;const mi=d.getMinutes();
    if(d.getHours()<12)spr('am');                         // AM mark (no mark in the afternoon)
    const t=[Math.floor(h/10)||null,h%10,Math.floor(mi/10),mi%10];
    const CX=[94,156,248,310];    // hour cells, colon, minute cells (minutes share the score's cells)
    for(let k=0;k<4;k++){if(t[k]===null)continue;const im=IMG['d'+t[k]];if(im&&im.complete)ctx.drawImage(im,CX[k],0,ATLAS.digits.ones.w,ATLAS.digits.ones.h)}
    if(Math.floor(now/500)%2===0){ctx.fillStyle='#1a201a';ctx.beginPath();ctx.ellipse(236,35,6,6,0,0,Math.PI*2);ctx.ellipse(232,64,6,6,0,0,Math.PI*2);ctx.fill()}  // slanted like the digits
  }else{
    const blink=mode==='over'&&now-overAt<3500&&Math.floor(now/260)%2===1;
    if(!blink)digits(score);
  }
  // paused: the scene freezes and PAUSE blinks in the LCD's own lettering (no overlay, like a real LCD)
  if(paused&&Math.floor(performance.now()/600)%2===0)spr('pause_txt');

}

/* ---------- loop ---------- */
function loop(){const now=gnow();update(now);render(now);requestAnimationFrame(loop)}
requestAnimationFrame(loop);
if(location.hash==='#debug')window.__score=v=>{score=v};
if(location.hash==='#debug')window.__st=()=>({rallies,stepC:Math.round(stepC()),maxB:cfg().max,mode,score,miss,spot,ms:missSeq?gnow()-missSeq.t0:-1,balls:balls.map(b=>({to:b.to,lane:b.lane,i:b.i,n:b.path.length,ret:b.ret,type:b.type}))});

/* ---------- input ---------- */
const $=id=>document.getElementById(id);
function press(el,fn){
  const on=e=>{e.preventDefault();el.classList.add('on');try{navigator.vibrate&&navigator.vibrate(8)}catch(_){}fn()};
  const off=()=>el.classList.remove('on');
  el.addEventListener('pointerdown',on);
  ['pointerup','pointerleave','pointercancel'].forEach(ev=>el.addEventListener(ev,off));
}
const bind=(ids,fn)=>ids.forEach(i=>press($(i),fn));
bind(['up','tUp'],()=>move(-1));bind(['down','tDown'],()=>move(1));
bind(['hit','tHit'],doHit);bind(['bA','tA'],()=>start('A'));bind(['bB','tB'],()=>start('B'));
bind(['bT','tT'],toClock);
bind(['pause','dPause'],togglePause);
bind(['restart','dRestart'],()=>{start(game)});
// screen layout: landscape device <-> upright device (remembered)
let layout=null;try{layout=localStorage.getItem('snoopy-layout')}catch(e){}
if(layout!=='land'&&layout!=='port')layout=(innerWidth<720&&innerHeight>innerWidth)?'port':'land';
bind(['lay','dLay'],()=>{layout=layout==='land'?'port':'land';try{localStorage.setItem('snoopy-layout',layout)}catch(e){}fit()});
document.addEventListener('visibilitychange',()=>{if(document.hidden)setPause(true)});
const KEYS={ArrowUp:()=>move(-1),KeyW:()=>move(-1),ArrowDown:()=>move(1),KeyS:()=>move(1),
  Space:doHit,KeyZ:doHit,Enter:doHit,KeyX:doHit,Digit1:()=>start('A'),KeyA:()=>start('A'),Digit2:()=>start('B'),KeyB:()=>start('B'),KeyT:toClock,KeyR:()=>start(game),KeyP:togglePause,Escape:togglePause};
addEventListener('keydown',e=>{const f=KEYS[e.code];if(!f)return;e.preventDefault();if(!e.repeat)f()});
function syncLeds(){
  document.querySelectorAll('[data-led=pause]').forEach(e=>e.classList.toggle('lit',paused));
  document.querySelectorAll('[data-led=snd]').forEach(e=>e.classList.toggle('lit',!muted));
}
bind(['snd','dSnd'],()=>{muted=!muted;try{localStorage.setItem('snoopy-mute',muted?'1':'0')}catch(e){}if(!muted)beep(880,.08);syncLeds()});
syncLeds();

/* ---------- layout ---------- */
const stage=$('stage'),shell=$('shell');
const LCD={x:564,y:322};
function fit(){
  const de=document.documentElement,vv=window.visualViewport;
  const vw=Math.min(innerWidth,de.clientWidth||innerWidth,vv?vv.width:innerWidth),vh=Math.min(innerHeight,vv?vv.height:innerHeight);
  const portraitView=vh>vw;
  const upright=layout==='port';                 // the device stood on its side
  const rotate=layout==='land'&&portraitView;    // landscape device on an upright phone: turn it 90°
  if(upright){
    stage.style.display='none';shell.style.display='block';
    if(cv.parentNode!==$('lcdSlot'))$('lcdSlot').appendChild(cv);
    cv.removeAttribute('style');
    // a wide or short screen can't hold the upright device at full size: draw it at a fixed
    // phone size and scale the whole thing down, centred
    const face=$('face'),scaled=!portraitView||vh<560||vw>vh*0.75;
    shell.classList.toggle('scaled',scaled);
    if(scaled){
      const DW=390,DH=760,k=Math.min((vh-16)/DH,(vw-16)/DW);
      face.style.cssText=`position:absolute;width:${DW}px;height:${DH}px;left:${(vw-DW*k)/2}px;top:${(vh-DH*k)/2}px;transform:scale(${k});transform-origin:0 0`;
    }else face.removeAttribute('style');
  }else{
    shell.style.display='none';stage.style.display='block';
    if(cv.parentNode!==stage)stage.appendChild(cv);
    cv.removeAttribute('style');
    stage.style.left='0px';stage.style.top='0px';
    if(rotate){
      const s=Math.min(vh/2123,vw/1302)*0.97, w=2123*s, h=1302*s;
      const L=(vw-h)/2,T=(vh-w)/2;
      stage.style.transform=`translate(${L+h}px,${T}px) rotate(90deg) scale(${s})`;
    }else{
      const s=Math.min(vw/2123,vh/1302)*0.97;
      const L=(vw-2123*s)/2,T=(vh-1302*s)/2;
      stage.style.transform=`translate(${L}px,${T}px) scale(${s})`;
    }
  }
}
showBest();
addEventListener('resize',fit);addEventListener('orientationchange',()=>setTimeout(fit,250));
if(window.visualViewport)visualViewport.addEventListener('resize',fit);fit();

if('serviceWorker' in navigator&&location.protocol.startsWith('http')){
  addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
})();
</script>
</body>
</html>
